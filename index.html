<!doctype html><html lang="tr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#08050f"><title>Halime ❤️</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}body{background:radial-gradient(circle at 50% 0,#4b205c,#21102f 42%,#08050f);color:#fff;font-family:Georgia,"Times New Roman",serif;display:flex;align-items:center;justify-content:center;padding:12px;min-height:100dvh}.card{width:100%;max-width:520px;height:min(700px,calc(100dvh - 24px));padding:26px 18px 20px;text-align:center;background:rgba(255,255,255,.075);border:1px solid rgba(255,255,255,.15);border-radius:25px;backdrop-filter:blur(15px);-webkit-backdrop-filter:blur(15px);box-shadow:0 0 45px rgba(255,70,150,.2);display:flex;flex-direction:column;overflow:hidden}.small{font-size:10px;letter-spacing:2px;color:#dfb8d0;margin-bottom:10px}h1{font-size:clamp(42px,13vw,70px);font-weight:normal;line-height:1;margin:0 0 14px;background:linear-gradient(90deg,#fff,#ffafd4,#fff);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}.message-box{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:4px}.message{font-size:clamp(15px,4.5vw,19px);line-height:1.62;color:#f7eaf2}.heart{font-size:42px;margin-top:10px;animation:beat 1.4s infinite}.footer{font-size:10px;color:#ad96a5;margin-top:7px}@keyframes beat{0%,100%{transform:scale(1)}15%{transform:scale(1.23)}30%{transform:scale(1)}45%{transform:scale(1.15)}60%{transform:scale(1)}}.star{position:fixed;width:2px;height:2px;background:#fff;border-radius:50%;animation:twinkle 2s infinite alternate}@keyframes twinkle{from{opacity:.15}to{opacity:1;transform:scale(1.4)}}.butterfly,.floating-heart{position:fixed;pointer-events:none;z-index:5}.butterfly{left:-50px;bottom:-40px;font-size:28px;animation:fly 9s linear forwards}@keyframes fly{0%{transform:translate(0,0);opacity:0}10%{opacity:.85}50%{transform:translate(48vw,-38vh)}100%{transform:translate(115vw,-100vh);opacity:0}}.floating-heart{bottom:-30px;animation:up 7s linear forwards}@keyframes up{0%{transform:translateY(0);opacity:0}10%{opacity:.9}100%{transform:translateY(-110dvh);opacity:0}}@media(max-height:650px){body{padding:8px}.card{height:calc(100dvh - 16px);padding:18px 15px 12px}h1{font-size:42px;margin-bottom:8px}.heart{font-size:34px}.footer{display:none}}</style></head><body><div id="stars"></div><main class="card"><div class="small">SANA SÖYLEMEK İSTEDİĞİM BİR ŞEY VAR</div><h1>Halime ❤️</h1><div class="message-box" id="box"><div class="message"><span id="typed"></span></div></div><div class="heart">❤️</div><div class="footer">Bazı şeyler anlatılmaz... sadece hissedilir.</div></main><script>(function(){var m="Halime...\n\nBazen insanın içinde anlatmak istediği\no kadar çok şey olur ki,\nkelimeler yetmez.\n\nBenim sana söylemek istediğim şey\naslında çok basit:\n\nSeni seviyorum. ❤️\n\nHem de sadece güzel olduğun için değil...\n\nGülüşün,\nsesin,\nyanımdayken hissettirdiğin huzur\nve sadece sen olduğun için.\n\nHayatımda karşıma çıkan\nen güzel şeylerden biri sensin.\n\nBelki bunu mükemmel cümlelerle\nanlatamıyorum...\n\nAma şunu bütün içtenliğimle bil:\n\nİyi ki varsın Halime.\n\nSeni gerçekten çok seviyorum. ❤️";var t=document.getElementById("typed"),b=document.getElementById("box"),i=0;for(var n=0;n<80;n++){var s=document.createElement("i");s.className="star";s.style.left=Math.random()*100+"vw";s.style.top=Math.random()*100+"vh";document.getElementById("stars").appendChild(s)}function type(){if(i>=m.length)return;var c=m.charAt(i++);t.appendChild(c==="\n"?document.createElement("br"):document.createTextNode(c));b.scrollTop=b.scrollHeight;setTimeout(type,32)}setTimeout(type,900);function fly(){var x=document.createElement("div");x.className="butterfly";x.textContent="🦋";x.style.bottom=(-10+Math.random()*45)+"vh";x.style.animationDuration=(8+Math.random()*6)+"s";document.body.appendChild(x);setTimeout(function(){x.remove()},15000)}setInterval(fly,1900);setTimeout(fly,1400);function heart(){var x=document.createElement("div"),a=["❤️","💕","💗","💖","💘"];x.className="floating-heart";x.textContent=a[Math.floor(Math.random()*a.length)];x.style.left=Math.random()*100+"vw";x.style.fontSize=14+Math.random()*18+"px";x.style.animationDuration=5+Math.random()*5+"s";document.body.appendChild(x);setTimeout(function(){x.remove()},10000)}setInterval(heart,900)})()</script></body></html>
